<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="648px" preserveAspectRatio="none" style="width:560px;height:648px;background:#FFFFFF;" version="1.1" viewBox="0 0 560 648" width="560px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="1"><text fill="#111827" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="439.6738" x="56.6631" y="22.9951">Paired teacher-forced scoring with per-chunk reduction</text></g><!--cluster loop--><g class="cluster" data-qualified-name="loop" data-source-line="18" id="ent0001"><rect fill="#EDE9FE" height="589.97" rx="5" ry="5" style="stroke:#4B5563;stroke-width:1;" width="539" x="7" y="44.2969"/><text fill="#111827" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="118.9111" x="217.0444" y="59.292">Per-chunk loop</text><text fill="#111827" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="523.9336" x="14.5332" y="75.5889">repeats over the corpus; nothing vocab-wide survives an iteration</text></g><!--entity chunk--><g class="entity" data-qualified-name="loop.chunk" data-source-line="19" id="ent0002"><rect fill="#DBEAFE" height="52.5938" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="248.334" x="217.83" y="95.2969"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="136.124" x="227.83" y="118.292">Fixed corpus chunk</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="228.334" x="227.83" y="134.5889">the same tokens drive both runs</text></g><!--entity ref--><g class="entity" data-qualified-name="loop.ref" data-source-line="20" id="ent0003"><rect fill="#DCFCE7" height="52.5938" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="179.2158" x="48.39" y="208.8869"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="99.3877" x="58.39" y="231.882">Reference run</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="159.2158" x="58.39" y="248.1789">full-precision KV cache</text></g><!--entity quant--><g class="entity" data-qualified-name="loop.quant" data-source-line="21" id="ent0004"><rect fill="#DCFCE7" height="52.5938" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="158.5576" x="262.72" y="208.8869"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="99.5244" x="272.72" y="231.882">Quantized run</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="138.5576" x="272.72" y="248.1789">quantized KV cache</text></g><!--entity logits--><g class="entity" data-qualified-name="loop.logits" data-source-line="22" id="ent0005"><rect fill="#FEF3C7" height="52.5938" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="311.3135" x="48.34" y="322.4869"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="122.7119" x="58.34" y="345.482">Paired fp32 logits</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="291.3135" x="58.34" y="361.7789">vocab-wide, one tensor per run, transient</text></g><!--entity scalars--><g class="entity" data-qualified-name="loop.scalars" data-source-line="23" id="ent0006"><rect fill="#DCFCE7" height="52.5938" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="304.3682" x="70.82" y="452.0769"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="136.8555" x="80.82" y="475.072">Per-position scalars</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.3682" x="80.82" y="491.3689">KL divergence, top-token flip, target NLL</text></g>