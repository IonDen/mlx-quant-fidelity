ust="spacing" textLength="161.2803" x="733.2249" y="595.3789">to the quantized cache</text></g><!--entity token_kivi--><g class="entity" data-qualified-name="proposed.token_kivi" data-source-line="30" id="ent0010"><rect fill="#DBEAFE" height="52.5938" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="150.3477" x="256.7549" y="147.7069"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="130.3477" x="266.7549" y="170.702">New decode token</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="78.9756" x="266.7549" y="186.9989">K_t and V_t</text></g><!--entity value_group--><g class="entity" data-qualified-name="proposed.value_group" data-source-line="31" id="ent0011"><rect fill="#DCFCE7" height="52.5938" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="218.8506" x="407.4949" y="285.4569"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="75.8105" x="417.4949" y="308.452">Value path</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="198.8506" x="417.4949" y="324.7489">per-token group is complete</text></g><!--entity value_cache--><g class="entity" data-qualified-name="proposed.value_cache" data-source-line="32" id="ent0012"><rect fill="#DCFCE7" height="36.2969" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="184.6777" x="396.5849" y="489.7869"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="164.6777" x="406.5849" y="512.782">Quantize V and append</text></g><!--entity key_group--><g class="entity" data-qualified-name="proposed.key_group" data-source-line="34" id="ent0013"><rect fill="#FDE68A" height="52.5938" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="245.8936" x="126.9749" y="285.4569"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="62.3574" x="136.9749" y="308.452">Key path</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="225.8936" x="136.9749" y="324.7489">per-channel group spans tokens</text></g><!--entity incomplete--><g class="entity" data-qualified-name="proposed.incomplete" data-source-line="35" id="ent0014"><rect fill="#FECACA" height="52.5938" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="247.3223" x="153.2649" y="407.1969"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="227.3223" x="163.2649" y="430.192">Current Key group is incomplete</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="222.5713" x="163.2649" y="446.4889">a direct append would repack it</text></g><!--entity residual--><g class="entity" data-qualified-name="proposed.residual" data-source-line="36" id="ent0015"><rect fill="#FEF3C7" height="52.5938" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="216.7656" x="198.5449" y="556.0869"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="152.8516" x="208.5449" y="579.082">Keep recent Keys in a</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="196.7656" x="208.5449" y="595.3789">full-precision residual buffer</text></g><!--entity close_block--><g class="entity" data-qualified-name="proposed.close_block" data-source-line="37" id="ent0016"><rect fill="#DCFCE7" height="52.5938" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="236.4873" x="207.6849" y="703.6769"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="216.4873" x="217.6849" y="726.672">When group_size tokens arrive</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="209.501" x="217.6849" y="742.9689">quantize the closed Key block</text></g><!--entity mixed_attention--><g class="entity" data-qualified-name="proposed.mixed_attention" data-source-line="38" id="ent0017"><rect fill="#DBEAFE" height="52.5938" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="226.3564" x="293.7449" y="817.2769"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.7031" x="303.7449" y="840.272">Attention reads both</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="206.3564" x="303.7449" y="856.5689">quantized bulk + residual tail</text></g><!--link token_current to token_group--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="24" id="lnk6"><path d="M816.9249,200.5369 C816.9249,222.1169 816.9249,248.2069 816.9249,271.8669" fill="none" id="token_current-to-token_group" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="816.9249,276.8669,820.9249,267.8669,816.9249,271.8669,812.9249,267.8669,816.9249,276.8669" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link token_group to token_pack--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="25" id="lnk7"><path d="M816.9249,346.4269 C816.9249,368.6969 816.9249,391.9969 816.9249,409.9369" fill="none" id="token_group-to-token_pack" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="816.9249,414.9369,820.9249,405.9369,816.9249,409.9369,812.9249,405.9369,816.9249,414.9369" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link token_pack to token_cache--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="26" id="lnk8"><path d="M816.9249,451.9169 C816.9249,477.6069 816.9249,520.7969 816.9249,550.5869" fill="none" id="token_pack-to-token_cache" style="stroke:#4B5563;stroke-width:1;"/><po