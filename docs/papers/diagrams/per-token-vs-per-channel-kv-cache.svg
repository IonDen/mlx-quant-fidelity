<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="927px" preserveAspectRatio="none" style="width:1059px;height:927px;background:#FFFFFF;" version="1.1" viewBox="0 0 1059 927" width="1059px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="1"><text fill="#111827" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="460.9541" x="295.5469" y="22.9951">Why per-channel Key quantization needs a residual buffer</text></g><!--cluster shipped--><g class="cluster" data-qualified-name="shipped" data-source-line="18" id="ent0001"><rect fill="#EDE9FE" height="543.97" rx="5" ry="5" style="stroke:#4B5563;stroke-width:1;" width="246" x="697.9249" y="88.7069"/><text fill="#111827" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="103.3936" x="769.2282" y="103.702">mlx-lm today</text><text fill="#111827" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="230.2822" x="705.7838" y="119.9989">per-token groups for K and V</text></g><!--cluster proposed--><g class="cluster" data-qualified-name="proposed" data-source-line="29" id="ent0009"><rect fill="#FEF3C7" height="805.16" rx="5" ry="5" style="stroke:#4B5563;stroke-width:1;" width="555" x="102.9249" y="88.7069"/><text fill="#111827" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="228.0264" x="266.4118" y="103.702">KIVI-style asymmetric layout</text><text fill="#111827" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="275.9668" x="242.4415" y="119.9989">not implemented or validated here</text></g><!--entity token_current--><g class="entity" data-qualified-name="shipped.token_current" data-source-line="19" id="ent0002"><rect fill="#DBEAFE" height="52.5938" rx="5" ry="5" style="stroke:#4B5563;strok