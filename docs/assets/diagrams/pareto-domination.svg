<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="373px" preserveAspectRatio="none" style="width:421px;height:373px;background:#FFFFFF;" version="1.1" viewBox="0 0 421 373" width="421px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="1"><text fill="#111827" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="386.6406" x="13.9297" y="20.7803">What "dominated" means when comparing configurations</text></g><!--entity a--><g class="entity" data-qualified-name="a" data-source-line="18" id="ent0001"><rect fill="#DCFCE7" height="34" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="116.5029" x="86.5" y="47"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="96.5029" x="96.5" y="67.7803">Configuration A</text></g><!--entity b--><g class="entity" data-qualified-name="b" data-source-line="19" id="ent0002"><rect fill="#FECACA" height="34" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="116.5029" x="226.5" y="47"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="96.5029" x="236.5" y="67.7803">Configuration B</text></g><!--entity q--><g class="entity" data-qualified-name="q" data-source-line="21" id="ent0003"><rect fill="#DBEAFE" height="48" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="185.7578" x="6" y="134"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="72.3516" x="16" y="154.7803">A drifts less</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="165.7578" x="16" y="168.7803">lower mean KL divergence</text></g><!--entity c--><g class="entity" data-qualified-name="c" data-source-line="22" id="ent0004"><rect fill="#DBEAFE" height="48" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="195.0957" x="210.5" y="134"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="74.6895" x="220.5" y="154.7803">A costs less</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="175.0957" x="220.5" y="168.7803">fewer cache bytes per token</text></g><!--entity dom--><g class="entity" data-qualified-name="dom" data-source-line="24" id="ent0005"><rect fill="#FEF3C7" height="62" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="346.0947" x="53" y="219"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="92.6064" x="63" y="239.7803">B is dominated</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.2197" x="63" y="253.7803">worse on quality AND more expensive,</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="326.0947" x="63" y="267.7803">so nothing about your budget would make you pick it</text></g><g class="entity" data-qualified-name="GMN12" data-source-line="34" id="ent0013"><path d="M103,323 L103,362 A5,5 0 0 0 108,367 L344.4624,367 A5,5 0 0 0 349.4624,362 L349.4624,328 L339.4624,318 L230,318 L226,281.1352 L222,318 L108,318 A5,5 0 0 0 103,323" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M339.4624,318 L339.4624,325.5 A2.5,2.5 0 0 0 341.9624,328 L349.4624,328 L339.4624,318" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#111827" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="225.4624" x="109" y="333.0103">Ranking reports domination so you can</text><text fill="#111827" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="198.0088" x="109" y="346.0103">discard options outright, instead of</text><text fill="#111827" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="218.2515" x="109" y="359.0103">weighing every configuration by hand.</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="dependency" id="lnk6"><polygon fill="#4B5563" points="110.541,133.9181,118.1436,127.6571,112.777,129.446,110.9882,124.0794,110.541,133.9181" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M136.9874,81.0252 C129.677,95.646 121.0248,112.9505 112.777,129.446" fill="none" style="stroke:#4B5563;stroke-width:1;"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" data-link-type="dependency" id="lnk7"><polygon fill="#4B5563" points="254.0693,133.9623,247.6222,126.5169,249.5432,131.8376,244.2225,133.7586,254.0693,133.9623" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M166.3801,81.1919 C180.8272,91.7638 200.5594,105.5012 219,116 C230.088,122.3127 237.792,126.3209 249.5432,131.8376" fill="none" style="stroke:#4B5563;stroke-width:1;"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk8"><polygon fill="#4B5563" points="145.6656,133.9181,155.5061,133.5133,150.1473,131.7013,151.9593,126.3425,145.6656,133.9181" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M252.6013,81.0252 C223.0418,95.646 183.4969,115.2058 150.1473,131.7013" fill="none" style="stroke:#4B5563;stroke-width:1;"/><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="30.3481" x="216" y="111.0103">loses</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" id="lnk9"><polygon fill="#4B5563" points="302.2295,133.9181,303.9273,124.2167,301.0168,129.0674,296.1661,126.157,302.2295,133.9181" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M289.0063,81.0252 C292.6615,95.646 296.893,112.5719 301.0168,129.0674" fill="none" style="stroke:#4B5563;stroke-width