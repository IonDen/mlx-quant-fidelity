<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="387px" preserveAspectRatio="none" style="width:470px;height:387px;background:#FFFFFF;" version="1.1" viewBox="0 0 470 387" width="470px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="1"><text fill="#111827" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="386.6406" x="38.1797" y="20.7803">What "dominated" means when comparing configurations</text></g><!--entity a--><g class="entity" data-qualified-name="a" data-source-line="18" id="ent0001"><rect fill="#DCFCE7" height="34" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="116.5029" x="113" y="47"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="96.5029" x="123" y="67.7803">Configuration A</text></g><!--entity b--><g class="entity" data-qualified-name="b" data-source-line="19" id="ent0002"><rect fill="#FECACA" height="34" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="116.5029" x="264" y="47"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="96.5029" x="274" y="67.7803">Configuration B</text></g><!--entity q--><g class="entity" data-qualified-name="q" data-source-line="21" id="ent0003"><rect fill="#DBEAFE" height="48" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="210.6816" x="6" y="134"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="147.8545" x="16" y="154.7803">A is no worse on quality</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="190.6816" x="16" y="168.7803">mean KL divergence no higher</text></g><!--entity c--><g class="entity" data-qualified-name="c" data-source-line="22" id="ent0004"><rect fill="#DBEAFE" height="48" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="219.2402" x="235" y="134"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="133.0615" x="245" y="154.7803">A is no worse on cost</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="199.2402" x="245" y="168.7803">cache bytes per token no higher</text></g><!--entity dom--><g class="entity" data-qualified-name="dom" data-source-line="24" id="ent0005"><rect fill="#FEF3C7" height="76" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="346.0947" x="80.5" y="219"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="92.6064" x="90.5" y="239.7803">B is dominated</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="184.4404" x="90.5" y="253.7803">A ties or beats it on both axes</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="172.0127" x="90.5" y="267.7803">and beats it on at least one,</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="326.0947" x="90.5" y="281.7803">so nothing about your budget would make you pick it</text></g><g class="entity" data-qualified-name="GMN12" data-source-line="34" id="ent0013"><path d="M130.5,337 L130.5,376 A5,5 0 0 0 135.5,381 L371.9624,381 A5,5 0 0 0 376.9624,376 L376.9624,342 L366.9624,332 L257.5,332 L253.5,295.1387 L249.5,332 L135.5,332 A5,5 0 0 0 130.5,337" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M366.9624,332 L366.9624,339.5 A2.5,2.5 0 0 0 369.4624,342 L376.9624,342 L366.9624,332" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#111827" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="225.4624" x="136.5" y="347.0103">Ranking reports domination so you can</text><text fill="#111827" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="198.0088" x="136.5" y="360.0103">discard options outright, instead of</text><text fill="#111827" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="218.2515" x="136.5" y="373.0103">weighing every configuration by hand.</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="dependency" id="lnk6"><polygon fill="#4B5563" points="126.5534,133.9181,134.8203,128.5647,129.2848,129.73,128.1194,124.1945,126.5534,133.9181" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M161.0488,81.0252 C151.5135,95.646 140.0427,113.2346 129.2848,129.73" fill="none" style="stroke:#4B5563;stroke-width:1;"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" data-link-type="dependency" id="lnk7"><polygon fill="#4B5563" points="248.1245,133.9901,241.2864,126.9021,243.4907,132.1118,238.281,134.3161,248.1245,133.9901" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M181.3507,81.4001 C188.8675,92.6194 200.1798,107.0312 213.5,116 C224.0757,123.1208 231.3186,127.1777 243.4907,132.1118" fill="none" style="stroke:#4B5563;stroke-width:1;"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" id="lnk8"><polygon fill="#4B5563" points="164.4378,133.9181,174.2865,133.9876,169.0211,131.9197,171.089,126.6544,164.4378,133.9181" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M285.7466,81.0252 C252.2141,95.646 206.8531,115.4242 169.0211,131.9197" fill="none" style="stroke:#4B5563;stroke-width:1;"/><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="72.9917" x="243.5" y="111.0103">does not win</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" id="lnk9"><polygon fill="#4B5563" points="338.9804,133.9181,340.7776,124.2346,337.8175,129.0552,332.9969,126.0952,338.980