<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="395px" preserveAspectRatio="none" style="width:579px;height:395px;background:#FFFFFF;" version="1.1" viewBox="0 0 579 395" width="579px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="1"><text fill="#111827" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="340.1836" x="116.1582" y="20.7803">Where quantization changes your model's answers</text></g><!--entity model--><g class="entity" data-qualified-name="model" data-source-line="18" id="ent0001"><rect fill="#DBEAFE" height="34" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="190.4473" x="184" y="47"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="170.4473" x="194" y="67.7803">A quantized model, running</text></g><!--entity weights--><g class="entity" data-qualified-name="weights" data-source-line="20" id="ent0002"><rect fill="#FEF3C7" height="62" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="235.585" x="22" y="147"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="98.8203" x="32" y="167.7803">Weights on disk</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="215.585" x="32" y="181.7803">fixed when the repo was quantized</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="146.3164" x="32" y="195.7803">q4 / q6 / q8 safetensors</text></g><!--entity kv--><g class="entity" data-qualified-name="kv" data-source-line="21" id="ent0003"><rect fill="#FEF3C7" height="48" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="285.3438" x="278.5" y="154"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="129.1582" x="288.5" y="174.7803">KV cache in memory</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3438" x="288.5" y="188.7803">chosen at run time, grows with every token</text></g><!--entity cmdw--><g class="entity" data-qualified-name="cmdw" data-source-line="23" id="ent0004"><rect fill="#DCFCE7" height="48" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="265.9229" x="6" y="262"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="157.1719" x="16" y="282.7803">mlx-quant-fidelity weights</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="245.9229" x="16" y="296.7803">quantized repo vs higher-precision repo</text></g><!--entity cmdk--><g class="entity" data-qualified-name="cmdk" data-source-line="24" id="ent0005"><rect fill="#DCFCE7" height="48" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="263.5781" x="290" y="262"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="123.7031" x="300" y="282.7803">mlx-quant-fidelity kv</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="243.5781" x="300" y="296.7803">full-precision cache vs quantized cache</text></g><!--entity cmdc--><g class="entity" data-qualified-name="cmdc" data-source-line="25" id="ent0006"><rect fill="#EDE9FE" height="48" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="262.7988" x="180.5" y="347"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="164.1719" x="190.5" y="367.7803">mlx-quant-fidelity compare</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="242.7988" x="190.5" y="381.7803">ranks configurations by quality per byte</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" id="lnk7"><polygon fill="#4B5563" points="168.1108,146.7051,177.2677,143.0787,171.6111,143.1348,171.5551,137.4782,168.1108,146.7051" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M248.327,81.1719 C239.2421,86.4354 229.4661,92.5857 221,99 C202.1714,113.2653 186.5464,127.9006 171.6111,143.1348" fill="none" style="stroke:#4B5563;stroke-width:1;"/><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="111.2808" x="239.9958" y="111.0103">precision lost once,</text><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="145.2725" x="223" y="124.0103">before you downloaded it</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="dependency" id="lnk8"><polygon fill="#4B5563" points="410.8833,153.9887,410.4336,144.1501,408.6461,149.5171,403.2791,147.7296,410.8833,153.9887" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M338.7086,81.0857 C349.7991,85.7424 360.7806,91.6259 370,99 C388.3207,113.6537 400.0119,132.2595 408.6461,149.5171" fill="none" style="stroke:#4B5563;stroke-width:1;"/><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="155.3589" x="397" y="111.0103">precision lost continuously,</text><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="109.1289" x="420.115" y="124.0103">while you generate</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" id="lnk9"><polygon fill="#4B5563" points="139.2178,261.9138,143.3025,252.9519,139.265,256.914,135.3029,252.8765,139.2178,261.9138" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M139.7161,209.0918 C139.5579,225.8627 139.4111,241.4232 139.265,256.914" fill="none" style="stroke:#4B5563;stroke-width:1;"/><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="sp