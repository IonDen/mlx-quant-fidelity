<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="408px" preserveAspectRatio="none" style="width:803px;height:408px;background:#FFFFFF;" version="1.1" viewBox="0 0 803 408" width="803px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="1"><text fill="#111827" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="340.1836" x="227.9082" y="20.7803">Where quantization changes your model's answers</text></g><!--entity model--><g class="entity" data-qualified-name="model" data-source-line="18" id="ent0001"><rect fill="#DBEAFE" height="34" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="190.4473" x="196" y="47"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="170.4473" x="206" y="67.7803">A quantized model, running</text></g><!--entity weights--><g class="entity" data-qualified-name="weights" data-source-line="20" id="ent0002"><rect fill="#FEF3C7" height="62" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="235.585" x="21" y="147"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="98.8203" x="31" y="167.7803">Weights on disk</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="215.585" x="31" y="181.7803">fixed when the repo was quantized</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="146.3164" x="31" y="195.7803">q4 / q6 / q8 safetensors</text></g><!--entity kv--><g class="entity" data-qualified-name="kv" data-source-line="21" id="ent0003"><rect fill="#FEF3C7" height="48" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="285.3438" x="275.5" y="154"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="129.1582" x="285.5" y="174.7803">KV cache in memory</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3438" x="285.5" y="188.7803">chosen at run time, grows with every token</text></g><!--entity tpm--><g class="entity" data-qualified-name="tpm" data-source-line="22" id="ent0004"><rect fill="#FEF3C7" height="48" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="207.5029" x="579" y="154"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="125.2686" x="589" y="174.7803">Third-party methods</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="187.5029" x="589" y="188.7803">TurboQuant-MLX (uniform-bit)</text></g><!--entity cmdw--><g class="entity" data-qualified-name="cmdw" data-source-line="24" id="ent0005"><rect fill="#DCFCE7" height="48" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="265.9229" x="6" y="275"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="157.1719" x="16" y="295.7803">mlx-quant-fidelity weights</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="245.9229" x="16" y="309.7803">quantized repo vs higher-precision repo</text></g><!--entity cmdk--><g class="entity" data-qualified-name="cmdk" data-source-line="25" id="ent0006"><rect fill="#DCFCE7" height="48" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="263.5781" x="290" y="275"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="123.7031" x="300" y="295.7803">mlx-quant-fidelity kv</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="243.5781" x="300" y="309.7803">full-precision cache vs quantized cache</text></g><!--entity cmdc--><g class="entity" data-qualified-name="cmdc" data-source-line="26" id="ent0007"><rect fill="#EDE9FE" height="48" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="262.7988" x="180.5" y="360"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="164.1719" x="190.5" y="380.7803">mlx-quant-fidelity compare</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="242.7988" x="190.5" y="394.7803">ranks configurations by quality per byte</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" id="lnk8"><polygon fill="#4B5563" points="153.4396,146.7744,161.3335,140.8849,155.8874,142.4146,154.3578,136.9685,153.4396,146.7744" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M224.8734,81.0424 C213.2375,85.6694 201.7475,91.553 192,99 C175.6077,111.5235 164.9602,126.2547 155.8874,142.4146" fill="none" style="stroke:#4B5563;stroke-width:1;"/><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="111.2808" x="210.9958" y="111.0103">precision lost once,</text><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="145.2725" x="194" y="124.0103">before you downloaded it</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="dependency" id="lnk9"><polygon fill="#4B5563" points="398.9511,153.6518,396.1423,144.212,395.7017,149.8516,390.062,149.4111,398.9511,153.6518" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M319.6926,81.1662 C328.1556,86.4295 337.2261,92.5812 345,99 C365.0227,115.5325 381.7284,133.5101 395.7017,149.8516" fill="none" style="stroke:#4B5563;stroke-width:1;"/><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="155.3589" x="377" y="111.0103">precision lost continuously,</text><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="109.1289" x="400.115" y="124.0103">while you generate</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" data-link-type="dependency" id="lnk10"><polygon fill="#4B5563" points="139,274.7377,143,265.7377,139,269.7377,135,265.7377,139,274.7377" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M139,209.0287 C139,229.4092 139,250.9615 139,269.7377" fill="none" style="stroke:#4B5563;stroke-width:1;"/><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="77.3081" x="141" y="245.5103">measure with</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0006" data-link-type="dependency" id="lnk11"><polygon fill="#4B5563" points="421.2212,274.8317,424.9166,265.7024,421.0533,269.8345,416.9211,265.9711,421.2212,274.8317" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M418.7807,202.2269 C419.4855,223.195 420.3491,248.8845 421.0533,269.8345" fill="none" style="stroke:#4B5563;stroke-width:1;"/><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="77.3081" x="423" y="245.5103">measure with</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" data-link-type="dependency" id="lnk12"><polygon fill="#4B5563" points="472.492,274.9788,482.3404,274.8846,477.0414,272.9045,479.0216,267.6055,472.492,274.9788" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M632.3671,202.0855 C586.2636,223.1059 523.1008,251.9042 477.0414,272.9045" fill="none" style="stroke:#4B5563;stroke-width:1;"/><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="77.3081" x="578" y="239.0103">measure with</text><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="69.3481" x="581.98" y="252.0103">--kv-method</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0007" data-link-type="dependency" id="lnk13"><po