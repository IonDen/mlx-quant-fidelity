<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="464px" preserveAspectRatio="none" style="width:684px;height:464px;background:#FFFFFF;" version="1.1" viewBox="0 0 684 464" width="684px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="1"><text fill="#111827" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="305.7578" x="185.6211" y="20.7803">Two ways to measure: stress and deployment</text></g><!--cluster stress--><g class="cluster" data-qualified-name="stress" data-source-line="18" id="ent0001"><rect fill="#EDE9FE" height="158" rx="5" ry="5" style="stroke:#4B5563;stroke-width:1;" width="322" x="14" y="39"/><text fill="#111827" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="253.5928" x="48.2036" y="51.7803">stress  --quantize-start 0   (the default)</text></g><!--cluster deploy--><g class="cluster" data-qualified-name="deploy" data-source-line="24" id="ent0005"><rect fill="#EDE9FE" height="333" rx="5" ry="5" style="stroke:#4B5563;stroke-width:1;" width="332" x="344" y="123"/><text fill="#111827" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="222.4893" x="398.7554" y="135.7803">deployment  --quantize-start 5000</text></g><!--entity s1--><g class="entity" data-qualified-name="stress.s1" data-source-line="19" id="ent0002"><rect fill="#FEF3C7" height="48" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="272.123" x="22" y="64"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="86.3789" x="32" y="84.7803">every position</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="252.123" x="32" y="98.7803">quantized cache from the very first token</text></g><!--entity s2--><g class="entity" data-qualified-na